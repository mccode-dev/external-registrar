name: Register external McCode contribution
description: >-
  Write the *.ext manifests that register releases of external components,
  instruments or library files with McStas/McXtrace, hashing what was actually
  published, and optionally propose them to McCode -- either from the
  contributing repository when it releases, or from McCode by polling.
author: mccode-dev
branding:
  icon: package
  color: blue

inputs:
  mode:
    description: >-
      "release": run in the contributing repository, for one of its releases.
      "poll": run in a McCode checkout, and look for new releases of every
      repository its manifests name.
      "check": run in a McCode checkout, and fail if any recorded hash no
      longer matches what upstream serves (a moved tag, a rewritten archive).
    default: release

  templates:
    description: >-
      Directory of template *.ext manifests whose layout mirrors the McCode
      tree, e.g. .mccode/mcstas-comps/contrib/my-lib.ext. "@VERSION@" and
      "@REPOSITORY@" are substituted; a manifest already carrying a concrete
      "version" is repointed at the new one. Defaults to .mccode when neither
      this nor `files` is given and that directory exists.
    default: ''
  files:
    description: >-
      Alternative to templates: files to register, one per line, as paths in
      this repository ("src/Foo.comp", or "src/Foo.comp -> Bar.comp" to
      install under another name). Globs are expanded against the checkout.
    default: ''
  destination:
    description: With `files`, the manifest's path in the McCode tree, e.g. mcstas-comps/contrib/my-lib.ext.
    default: ''
  name:
    description: With `files`, the contribution name. Default is the repository name.
    default: ''
  description:
    description: With `files`, a one-line description.
    default: ''
  license:
    description: With `files`, an SPDX license identifier.
    default: ''
  source:
    description: With `files`, "raw" (fetch each file at the tag) or "archive" (take them from a release archive).
    default: raw
  archive-url:
    description: With source set to archive, the archive to use; an uploaded release asset is byte-stable, GitHub's generated tarball is the default.
    default: ''
  strip:
    description: With source set to archive, leading path components to drop.
    default: '1'
  version:
    description: The released tag.
    default: ${{ github.event.release.tag_name || github.ref_name }}
  repository:
    description: OWNER/REPO the files are published from.
    default: ${{ github.repository }}
  checkout:
    description: >-
      Checkout of the release. Files fetched raw, or from GitHub's generated
      archive, must be byte-identical to it; empty to skip that comparison.
    default: ${{ github.workspace }}
  output-dir:
    description: >-
      Where to write the manifests, under their McCode paths (in poll mode,
      one subdirectory per repository). Default is $RUNNER_TEMP/mccode-ext.
    default: ''

  mccode-checkout:
    description: Poll and check modes. The McCode checkout whose manifests are read.
    default: ${{ github.workspace }}
  paths:
    description: >-
      Check mode. Manifests or directories to check, one per line, relative to
      mccode-checkout. Default is the whole checkout.
    default: ''
  templates-path:
    description: Poll mode. Where each contributing repository keeps its templates.
    default: .mccode
  only:
    description: Poll mode. Poll just these OWNER/REPO repositories, one per line.
    default: ''
  prereleases:
    description: Poll mode. Consider pre-releases as well as releases.
    default: 'false'

  pull-request:
    description: Open (or refresh) a pull request to McCode with the manifests.
    default: 'false'
  token:
    description: >-
      Token for the pull request. The workflow's GITHUB_TOKEN cannot write to
      another repository: use a PAT or GitHub App token with contents:write on
      the head repository and pull-requests:write on McCode.
    default: ''
  mccode-repository:
    description: The McCode repository to propose to.
    default: mccode-dev/McCode
  mccode-branch:
    description: Branch of McCode to target.
    default: main
  fork:
    description: OWNER/REPO fork of McCode to push the branch to, for tokens that cannot push to McCode itself.
    default: ''
  branch:
    description: >-
      Head branch name. The default, external/OWNER-REPO, is stable so that a
      new release updates a still-open pull request instead of opening another.
    default: ''
  title:
    description: Pull request title. Default is "Register OWNER/REPO VERSION".
    default: ''
  labels:
    description: Comma-separated labels to add, where the token is allowed to.
    default: ''
  draft:
    description: Open the pull request as a draft.
    default: 'false'
  dry-run:
    description: Report what the pull request would change, but push nothing.
    default: 'false'

outputs:
  manifests:
    description: McCode paths of the manifests written, space-separated.
    value: ${{ steps.render.outputs.manifests }}
  output-dir:
    description: Directory the manifests were written under.
    value: ${{ steps.render.outputs.output-dir || steps.poll.outputs.output-dir }}
  changed:
    description: Whether any manifest differs from McCode's (only set with pull-request).
    value: ${{ steps.propose.outputs.changed }}
  pull-request-url:
    description: Release mode. The pull request opened or updated.
    value: ${{ steps.propose.outputs.pull-request-url }}
  pull-request-urls:
    description: Poll mode. Every pull request opened, updated or already open, space-separated.
    value: ${{ steps.poll.outputs.pull-request-urls }}

runs:
  using: composite
  steps:
    - if: inputs.mode != 'release' && inputs.mode != 'poll' && inputs.mode != 'check'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "::error::mode must be release, poll or check, not '$MODE'"
        exit 1

    - id: render
      if: inputs.mode == 'release'
      shell: bash
      env:
        MCEXT: ${{ github.action_path }}/mcext.py
        TEMPLATES: ${{ inputs.templates }}
        FILES: ${{ inputs.files }}
        DESTINATION: ${{ inputs.destination }}
        NAME: ${{ inputs.name }}
        DESCRIPTION: ${{ inputs.description }}
        LICENSE: ${{ inputs.license }}
        SOURCE: ${{ inputs.source }}
        ARCHIVE_URL: ${{ inputs.archive-url }}
        STRIP: ${{ inputs.strip }}
        VERSION: ${{ inputs.version }}
        REPOSITORY: ${{ inputs.repository }}
        CHECKOUT: ${{ inputs.checkout }}
        OUT: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        out="${OUT:-$RUNNER_TEMP/mccode-ext}"
        if [[ -z "$TEMPLATES" && -z "$FILES" && -d .mccode ]]; then TEMPLATES=.mccode; fi
        args=(render --version "$VERSION" --repository "$REPOSITORY" --out "$out" --list "$RUNNER_TEMP/mccode-ext.list")
        [[ -n "$CHECKOUT" ]]    && args+=(--local "$CHECKOUT")
        [[ -n "$TEMPLATES" ]]   && args+=(--templates "$TEMPLATES")
        if [[ -n "$FILES" ]]; then
          args+=(--files "$FILES" --destination "$DESTINATION" --source "$SOURCE" --strip "$STRIP")
          [[ -n "$NAME" ]]        && args+=(--name "$NAME")
          [[ -n "$DESCRIPTION" ]] && args+=(--description "$DESCRIPTION")
          [[ -n "$LICENSE" ]]     && args+=(--license "$LICENSE")
          [[ -n "$ARCHIVE_URL" ]] && args+=(--archive-url "$ARCHIVE_URL")
        fi
        python3 "$MCEXT" "${args[@]}"
        {
          echo "manifests=$(tr '\n' ' ' < "$RUNNER_TEMP/mccode-ext.list" | sed 's/ $//')"
          echo "output-dir=$out"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### McCode manifests for $REPOSITORY $VERSION"
          while read -r manifest; do
            printf '\n<details><summary><code>%s</code></summary>\n\n```json\n' "$manifest"
            cat "$out/$manifest"
            printf '```\n</details>\n'
          done < "$RUNNER_TEMP/mccode-ext.list"
        } >> "$GITHUB_STEP_SUMMARY"

    - id: propose
      if: inputs.mode == 'release' && inputs.pull-request == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PROPOSE: ${{ github.action_path }}/propose.py
        OUT: ${{ steps.render.outputs.output-dir }}
        UPSTREAM: ${{ inputs.mccode-repository }}
        BASE: ${{ inputs.mccode-branch }}
        FORK: ${{ inputs.fork }}
        BRANCH: ${{ inputs.branch }}
        TITLE: ${{ inputs.title }}
        LABELS: ${{ inputs.labels }}
        DRAFT: ${{ inputs.draft }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERSION: ${{ inputs.version }}
        REPOSITORY: ${{ inputs.repository }}
        RELEASE_URL: ${{ github.event.release.html_url }}
      run: |
        set -euo pipefail
        args=(--rendered "$OUT" --list "$RUNNER_TEMP/mccode-ext.list"
              --upstream "$UPSTREAM" --base "$BASE"
              --branch "${BRANCH:-external/${REPOSITORY/\//-}}"
              --repository "$REPOSITORY" --version "$VERSION" --labels "$LABELS")
        [[ -n "$FORK" ]]        && args+=(--head-repository "$FORK")
        [[ -n "$TITLE" ]]       && args+=(--title "$TITLE")
        [[ -n "$RELEASE_URL" ]] && args+=(--release-url "$RELEASE_URL")
        [[ "$DRAFT" == true ]]  && args+=(--draft)
        [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
        python3 "$PROPOSE" "${args[@]}"

    - id: poll
      if: inputs.mode == 'poll'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        POLL: ${{ github.action_path }}/poll.py
        MCCODE: ${{ inputs.mccode-checkout }}
        UPSTREAM: ${{ inputs.mccode-repository }}
        BASE: ${{ inputs.mccode-branch }}
        TEMPLATES_PATH: ${{ inputs.templates-path }}
        ONLY: ${{ inputs.only }}
        PRERELEASES: ${{ inputs.prereleases }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        LABELS: ${{ inputs.labels }}
        DRAFT: ${{ inputs.draft }}
        DRY_RUN: ${{ inputs.dry-run }}
        OUT: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        out="${OUT:-$RUNNER_TEMP/mccode-ext}"
        args=(--mccode "$MCCODE" --upstream "$UPSTREAM" --base "$BASE" --out "$out"
              --templates-path "$TEMPLATES_PATH" --labels "$LABELS")
        while read -r repo; do
          if [[ -n "$repo" ]]; then args+=(--only "$repo"); fi
        done <<< "$ONLY"
        [[ "$PRERELEASES" == true ]]  && args+=(--prereleases)
        [[ "$PULL_REQUEST" == true ]] && args+=(--propose)
        [[ "$DRAFT" == true ]]        && args+=(--draft)
        [[ "$DRY_RUN" == true ]]      && args+=(--dry-run)
        echo "output-dir=$out" >> "$GITHUB_OUTPUT"
        python3 "$POLL" "${args[@]}"

    - id: check
      if: inputs.mode == 'check'
      shell: bash
      working-directory: ${{ inputs.mccode-checkout }}
      env:
        MCEXT: ${{ github.action_path }}/mcext.py
        PATHS: ${{ inputs.paths }}
      run: |
        set -uo pipefail
        args=(check)
        while read -r path; do
          if [[ -n "$path" ]]; then args+=("$path"); fi
        done <<< "$PATHS"
        python3 "$MCEXT" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/mcext-check.log"
        status=${PIPESTATUS[0]}
        {
          echo "### External contributions: hash check"
          printf '\n```\n'
          cat "$RUNNER_TEMP/mcext-check.log"
          printf '```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
