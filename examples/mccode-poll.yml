# .github/workflows/external-contributions.yml in mccode-dev/McCode.
#
# Once a day, look for new releases of every repository a *.ext manifest names
# and open (or refresh) one pull request per repository. The app's key never
# leaves McCode; contributing repositories only have to publish releases.
name: External contributions

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Poll just this OWNER/REPO (blank for all)
        default: ''
      dry-run:
        description: Report, but open no pull requests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  poll:
    # Skipped, rather than failing daily, until the registrar app is set up.
    if: vars.REGISTRAR_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REGISTRAR_APP_ID }}
          private-key: ${{ secrets.REGISTRAR_PRIVATE_KEY }}

      - uses: mccode-dev/external-registrar@v1
        with:
          mode: poll
          pull-request: true
          token: ${{ steps.app-token.outputs.token }}
          only: ${{ inputs.only }}
          dry-run: ${{ inputs.dry-run || false }}
          labels: external contribution

  # Independently of new releases: has anything behind a pinned tag moved?
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mccode-dev/external-registrar@v1
        with:
          mode: check
