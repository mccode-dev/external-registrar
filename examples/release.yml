# .github/workflows/register.yml in an external repository.
#
# On every published release: hash the released files, write the McCode
# manifests, attach them to the release, and propose them to McCode.
name: Register with McCode

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to register
        required: true

permissions:
  contents: write            # for attaching the manifests to the release

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Only for repositories McCode trusts with the registrar app's key; see
      # "Two ways to run it" in the README. Everyone else can drop this step
      # and pull-request/token below, and let McCode's poll find the release.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.REGISTRAR_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRAR_PRIVATE_KEY }}
          owner: mccode-dev
          repositories: McCode

      - id: register
        uses: mccode-dev/external-registrar@v1
        with:
          version: ${{ inputs.tag || github.event.release.tag_name }}
          # templates: .mccode      # the default, when that directory exists
          # -- or, with no templates --
          # files: |
          #   chopper-lib.h
          #   chopper-lib.c
          # destination: mcstas-comps/share/chopper-lib.ext
          pull-request: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Attach the manifests to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tar -C "${{ steps.register.outputs.output-dir }}" -czf mccode-manifests.tar.gz .
          gh release upload "$TAG" mccode-manifests.tar.gz --clobber
