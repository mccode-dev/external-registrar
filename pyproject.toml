[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcext"
version = "1.0.0"
description = "Create, refresh and verify McCode external-contribution manifests (*.ext)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mcext = "mcext:main"

[tool.setuptools]
py-modules = ["mcext"]
